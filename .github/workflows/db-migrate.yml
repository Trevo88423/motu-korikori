name: Apply Supabase migrations

# Applies everything in dictionary-app/supabase/migrations/ to the production
# Supabase project whenever a migration file lands on main. Vercel deploys the
# app from the same push, so schema and code move together.
#
# ORDERING NOTE: this job must finish before the new app code serves traffic.
# The signup flow depends on the on_auth_user_created trigger from
# 20260803084739_atomic_signup.sql — deployed without it, signups create auth
# users with no profile and show no error.
#
# CONNECTION: connects straight to Postgres through the session pooler with
# --db-url, so the only secret is SUPABASE_DB_PASSWORD (Project Settings >
# Database). No Supabase access token: `supabase link` needs GET /api-keys,
# which scoped tokens refuse without API Key Secrets access, so it was dropped.
# The pooler host comes from the project's pooler config; if Supabase moves it,
# copy the new host from Project Settings > Database > Connection string
# (Session pooler).
#
# HISTORY NOTE: file versions must match production's
# supabase_migrations.schema_migrations exactly, or `db push` refuses to run.
# Production records 20260801051846_remote_schema (the baseline dump),
# 20260803084707_lock_down_profile_updates and 20260803084739_atomic_signup.
# Never rename an applied migration; create new ones with `npm run db:new`.
#
# ORDER NOTE: pushes use --include-all, so a migration whose version is OLDER
# than the newest one already applied still runs, as long as it hasn't been
# applied yet. Several sessions build in parallel and merge in any order;
# without this, db push refused the later-merged, earlier-versioned file.
# Versions must still be unique.
# schema.sql and migration-voting-system.sql are historical and are NOT in
# migrations/ — they are already applied and must not be replayed.

on:
  push:
    branches: [main]
    paths:
      - 'dictionary-app/supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: supabase-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dictionary-app
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Build production connection URL
        run: |
          enc=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$enc"
          echo "DB_URL=postgresql://postgres.mwygcqumpjswovyukcct:${enc}@aws-1-ap-south-1.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"

      - name: Show pending migrations
        run: supabase migration list --db-url "$DB_URL"

      - name: Apply migrations
        run: supabase db push --include-all --db-url "$DB_URL"

      - name: Confirm nothing left pending
        run: supabase db push --include-all --dry-run --db-url "$DB_URL"
