# Supabase CLI project config. Used by the local stack (`npm run db:start`).
# Production is not configured from this file: migrations reach prod through
# .github/workflows/db-migrate.yml, and auth settings live in the dashboard.
project_id = "motu-korikori"

[db]
major_version = 17

[auth]
# The dev server falls back to 3001 when 3000 is taken; allow both.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3001/**",
]

[auth.email]
# Match production: signups must click the emailed link before signing in.
# Local emails land in Mailpit at http://127.0.0.1:54324.
enable_confirmations = true
